<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Bandage — across forehead area (~y=140-200) -->
  <g transform="translate(256,170)">
    <rect x="-110" y="-20" width="220" height="40" rx="8" fill="#F5F0E8" stroke="#D4C9A8" stroke-width="3"/>
    <!-- Bandage cross marks -->
    <line x1="-40" y1="-18" x2="-40" y2="18" stroke="#E8D5C0" stroke-width="4"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#E8D5C0" stroke-width="4"/>
    <line x1="40" y1="-18" x2="40" y2="18" stroke="#E8D5C0" stroke-width="4"/>
    <!-- Red cross center -->
    <rect x="-8" y="-20" width="16" height="40" fill="#FF3333" opacity="0.6"/>
    <rect x="-40" y="-8" width="80" height="16" fill="#FF3333" opacity="0.6"/>
    <!-- Tape edges -->
    <rect x="-110" y="-20" width="30" height="40" rx="4" fill="#C8B88A" stroke="#A09070" stroke-width="2"/>
    <rect x="80" y="-20" width="30" height="40" rx="4" fill="#C8B88A" stroke="#A09070" stroke-width="2"/>
  </g>
</svg>
