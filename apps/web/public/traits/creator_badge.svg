<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Creator Badge — tool/wrench icon on chest area -->
  <g transform="translate(256,300)" fill="none">
    <!-- Badge shield background -->
    <path d="M-50,-60 L50,-60 L60,-20 L0,60 L-60,-20 Z" fill="#1a1a2e" stroke="#00d4ff" stroke-width="4"/>
    <!-- Gear/cog symbol inside badge -->
    <circle cx="0" cy="-5" r="22" fill="none" stroke="#00d4ff" stroke-width="5"/>
    <circle cx="0" cy="-5" r="10" fill="#00d4ff"/>
    <!-- Gear teeth -->
    <rect x="-4" y="-32" width="8" height="10" rx="2" fill="#00d4ff"/>
    <rect x="-4" y="17" width="8" height="10" rx="2" fill="#00d4ff"/>
    <rect x="17" y="-9" width="10" height="8" rx="2" fill="#00d4ff"/>
    <rect x="-32" y="-9" width="10" height="8" rx="2" fill="#00d4ff"/>
    <!-- Diagonal teeth -->
    <rect x="10" y="-27" width="8" height="10" rx="2" fill="#00d4ff" transform="rotate(45,14,-22)"/>
    <rect x="-18" y="-27" width="8" height="10" rx="2" fill="#00d4ff" transform="rotate(-45,-14,-22)"/>
    <rect x="10" y="12" width="8" height="10" rx="2" fill="#00d4ff" transform="rotate(-45,14,17)"/>
    <rect x="-18" y="12" width="8" height="10" rx="2" fill="#00d4ff" transform="rotate(45,-14,17)"/>
    <!-- Small star accent on badge -->
    <polygon points="0,-55 3,-47 12,-47 5,-42 8,-34 0,-39 -8,-34 -5,-42 -12,-47 -3,-47" fill="#00d4ff" opacity="0.8"/>
  </g>
</svg>
