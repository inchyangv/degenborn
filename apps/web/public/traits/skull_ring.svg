    <rect x="-22" y="10" width="44" height="16" rx="8" fill="#888899" stroke="#AAAACC" stroke-width="2"/>
    <!-- Skull face -->
    <ellipse cx="0" cy="0" rx="28" ry="26" fill="#EEEEEE" stroke="#999" stroke-width="3"/>
    <!-- Eye sockets -->
    <ellipse cx="-9" cy="-4" rx="7" ry="7" fill="#1A1A1A"/>
