    <!-- Nose cavity -->
    <path d="M-4,6 L0,2 L4,6 L2,12 L-2,12 Z" fill="#1A1A1A"/>
    <!-- Teeth -->
    <path d="M-14,16 L14,16" stroke="#999" stroke-width="2"/>
    <line x1="-8" y1="16" x2="-8" y2="22" stroke="#CCCCCC" stroke-width="3"/>
    <line x1="0" y1="16" x2="0" y2="22" stroke="#CCCCCC" stroke-width="3"/>
    <line x1="8" y1="16" x2="8" y2="22" stroke="#CCCCCC" stroke-width="3"/>
