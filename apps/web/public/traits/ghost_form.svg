<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ghost form — full body semi-transparent aura -->
  <!-- Ghostly outer silhouette glow -->
  <ellipse cx="256" cy="280" rx="160" ry="220" fill="#AABBFF" opacity="0.12"/>
  <ellipse cx="256" cy="280" rx="130" ry="190" fill="#CCDDFF" opacity="0.10"/>
  <!-- Ghost wisps at bottom -->
  <g transform="translate(256,460)" opacity="0.5">
    <path d="M-80,0 Q-90,20 -80,40 Q-70,60 -80,80" fill="none" stroke="#AABBFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M-30,0 Q-20,25 -30,50 Q-40,70 -30,90" fill="none" stroke="#AABBFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M30,0 Q40,25 30,50 Q20,70 30,90" fill="none" stroke="#AABBFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M80,0 Q90,20 80,40 Q70,60 80,80" fill="none" stroke="#AABBFF" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- Spectral eyes overlay -->
  <g transform="translate(256,230)" opacity="0.6">
    <ellipse cx="-55" cy="0" rx="18" ry="14" fill="#DDEEFF"/>
    <ellipse cx="55" cy="0" rx="18" ry="14" fill="#DDEEFF"/>
  </g>
  <!-- Faint particle sparkles -->
  <g fill="#AABBFF" opacity="0.4">
    <circle cx="120" cy="150" r="4"/>
    <circle cx="390" cy="200" r="3"/>
    <circle cx="140" cy="350" r="5"/>
    <circle cx="380" cy="320" r="4"/>
    <circle cx="200" cy="100" r="3"/>
    <circle cx="320" cy="420" r="4"/>
  </g>
</svg>
