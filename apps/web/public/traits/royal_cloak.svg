<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Royal cloak — body/shoulders (~y=200-500) -->
  <g transform="translate(256,350)">
    <!-- Cloak body -->
    <path d="M-130,-130 Q-150,0 -140,130 L140,130 Q150,0 130,-130 Q90,-150 0,-160 Q-90,-150 -130,-130 Z"
          fill="#4A0080" stroke="#8800DD" stroke-width="4"/>
    <!-- Cloak inner lining -->
    <path d="M-110,-120 Q-120,0 -110,120 L110,120 Q120,0 110,-120 Q70,-135 0,-145 Q-70,-135 -110,-120 Z"
          fill="#3A0060" opacity="0.7"/>
    <!-- Gold trim at top -->
    <path d="M-130,-130 Q-90,-150 0,-160 Q90,-150 130,-130"
          fill="none" stroke="#FFD700" stroke-width="6"/>
    <!-- Gold hem at bottom -->
    <path d="M-140,130 L140,130" stroke="#FFD700" stroke-width="6" stroke-linecap="round"/>
    <!-- Clasp -->
    <circle cx="0" cy="-130" r="14" fill="#FFD700" stroke="#FFA500" stroke-width="3"/>
    <circle cx="0" cy="-130" r="7" fill="#FF6600"/>
    <!-- Decorative stars on cloak -->
    <text x="-60" y="-40" font-size="28" fill="#FFD700" opacity="0.6" text-anchor="middle">✦</text>
    <text x="60" y="-40" font-size="28" fill="#FFD700" opacity="0.6" text-anchor="middle">✦</text>
    <text x="0" y="40" font-size="22" fill="#FFD700" opacity="0.5" text-anchor="middle">✦</text>
  </g>
</svg>
