<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fallen Creator Mark — broken gear/tool with downward arrow, on chest -->
  <g transform="translate(256,320)" fill="none">
    <!-- Broken gear left half -->
    <path d="M-50,-30 A40,40 0 0,1 0,-70 L0,-50 A20,20 0 0,0 -30,-15 Z"
          fill="#8B0000" stroke="#FF4444" stroke-width="3" opacity="0.9"/>
    <!-- Broken gear right half (cracked) -->
    <path d="M50,-30 A40,40 0 0,0 0,-70 L0,-50 A20,20 0 0,1 30,-15 Z"
          fill="#4a0000" stroke="#FF4444" stroke-width="3" stroke-dasharray="4,2" opacity="0.7"/>
    <!-- Central broken piece -->
    <circle cx="0" cy="-20" r="18" fill="#8B0000" stroke="#FF4444" stroke-width="3"/>
    <!-- Crack lines through center -->
    <line x1="-8" y1="-38" x2="8" y2="-2" stroke="#FF4444" stroke-width="3" opacity="0.9"/>
    <line x1="-15" y1="-10" x2="5" y2="0" stroke="#FF4444" stroke-width="2" opacity="0.7"/>
    <!-- Downward arrow indicating fall -->
    <path d="M0,5 L0,50 M-20,30 L0,55 L20,30" stroke="#FF4444" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Small skull at bottom -->
    <circle cx="0" cy="68" r="14" fill="#1a0000" stroke="#FF4444" stroke-width="2.5"/>
    <circle cx="-5" cy="65" r="3.5" fill="#FF4444"/>
    <circle cx="5" cy="65" r="3.5" fill="#FF4444"/>
    <path d="M-6,73 L6,73" stroke="#FF4444" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Dark aura -->
    <ellipse cx="0" cy="20" rx="60" ry="20" fill="#FF4444" opacity="0.06"/>
  </g>
</svg>
